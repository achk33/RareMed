name: raremed

services:
  postgres:
    image: postgres:16-alpine
    container_name: raremed-postgres
    environment:
      POSTGRES_USER: raremed
      POSTGRES_PASSWORD: raremed
      POSTGRES_DB: raremed
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raremed -d raremed"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26
    container_name: raremed-neo4j
    environment:
      NEO4J_AUTH: neo4j/raremed-neo4j
      NEO4J_server_memory_heap_initial__size: 512M
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p raremed-neo4j -a bolt://localhost:7687 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  backend:
    build: ./backend
    container_name: raremed-backend
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://raremed:raremed@postgres:5432/raremed
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: raremed-neo4j
      NEO4J_DATABASE: neo4j
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_TIMEOUT_SECONDS: "2"
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      COOKIE_SECURE: "false"
      SESSION_TTL_SECONDS: "604800"
      DATA_ROOT: /data
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: raremed-frontend
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  neo4j_data:
